<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MAX Sports OS</title>

<style>

:root{

--bg:#05070d;
--panel:#0d1320;
--panel2:#151e31;
--sidebar:#080d16;
--text:#ffffff;
--accent:#00ffff;
--success:#31ff8a;
--danger:#ff5757;
--border:rgba(255,255,255,.08);

}

body.light{

--bg:#edf2f8;
--panel:#ffffff;
--panel2:#f5f7fb;
--sidebar:#ffffff;
--text:#111827;
--accent:#0066ff;
--border:#d6deeb;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{

background:var(--bg);
color:var(--text);

height:100vh;

display:flex;
flex-direction:column;

transition:.3s;

}

.topbar{

height:70px;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 20px;

background:var(--panel);

border-bottom:1px solid var(--border);

}

.logo{

font-size:28px;
font-weight:800;
color:var(--accent);

}

.theme-btn{

padding:10px 16px;

border:none;
border-radius:10px;

background:var(--accent);

cursor:pointer;
font-weight:bold;

}

.main{

flex:1;

display:grid;

grid-template-columns:
240px
1fr
320px;

overflow:hidden;

}

.sidebar{

background:var(--sidebar);

padding:20px;

overflow:auto;

border-right:1px solid var(--border);

}

.nav-item{

padding:12px;

border-radius:12px;

background:var(--panel);

margin-bottom:10px;

cursor:pointer;

transition:.2s;

}

.nav-item:hover{

transform:translateX(5px);

}

.section-title{

font-size:12px;
opacity:.5;

margin:20px 0 10px;

letter-spacing:2px;

}

.center{

overflow:auto;
padding:20px;

}

.hero{

padding:30px;

border-radius:20px;

margin-bottom:20px;

background:
linear-gradient(
135deg,
#071b30,
#10406f
);

}

.hero h1{

font-size:48px;

color:white;

}

.hero p{

margin-top:10px;
opacity:.8;

}

.metrics{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:15px;

margin-top:25px;

}

.metric{

background:var(--panel);

padding:18px;

border-radius:14px;

text-align:center;

}

.metric-value{

font-size:28px;
font-weight:800;

color:var(--accent);

animation:pulse 2s infinite;

}

@keyframes pulse{

50%{

transform:scale(1.07);

}

}

.filters{

display:flex;
gap:12px;
flex-wrap:wrap;

margin-bottom:20px;

}

.filters select,
.filters input{

padding:12px;

border-radius:10px;

border:1px solid var(--border);

background:var(--panel);

color:var(--text);

}

.filters input{

flex:1;

}

.grid{

display:grid;

grid-template-columns:
1fr
1fr;

gap:20px;

}
 .card{

background:var(--panel);

padding:20px;

border-radius:20px;

border:1px solid var(--border);

}

.card h3{

margin-bottom:15px;

color:var(--accent);

}

.game{

background:var(--panel2);

padding:12px;

border-radius:10px;

margin-bottom:10px;

display:flex;

justify-content:space-between;

align-items:center;

}

.live{

color:var(--danger);

font-size:12px;

font-weight:bold;

animation:blink 1s infinite;

}

@keyframes blink{

50%{
opacity:.4;
}

}

.chart{

height:220px;

display:flex;

align-items:flex-end;

gap:10px;

padding-top:20px;

}

.bar{

flex:1;

background:
linear-gradient(
180deg,
var(--accent),
#005eff
);

border-radius:8px 8px 0 0;

transition:.5s;

}

.right{

background:var(--sidebar);

padding:20px;

overflow:auto;

border-left:1px solid var(--border);

}

.process{

display:flex;

justify-content:space-between;

padding:12px;

border-radius:10px;

background:var(--panel);

margin-bottom:10px;

}

.running{

color:var(--success);

font-weight:bold;

}
