<!DOCTYPE html>
<html lang="en" class="h-full bg-[#030712] text-slate-100 selection:bg-cyan-500 selection:text-black">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PORTAL‑OS‑1 // MAX‑SIM Shell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{--accent:#00f3ff;--panel:#0f172a;--text:#e2e8f0}
    body{background:#030712;color:#e6eef8;font-family:Inter,system-ui,Arial}
    .card{background:var(--panel);border:1px solid rgba(30,41,59,.6);border-radius:12px;padding:12px}
    .maps-grid{display:grid;grid-template-columns:1fr 360px;gap:12px}
    .map-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
    .map-tab{background:#0b1220;padding:6px 10px;border-radius:8px;cursor:pointer;border:1px solid rgba(255,255,255,0.02)}
    .map-tab.active{background:var(--accent);color:#000}
    #maps-list{max-height:420px;overflow:auto}
    .node{background:#071027;border-radius:8px;padding:8px;border:1px solid rgba(255,255,255,0.03);cursor:grab}
    .hud{position:relative}
    canvas {display:block}
  </style>
</head>
<body class="p-4">
  <header class="mb-4 flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold">PORTAL‑OS‑1</h1>
      <div class="text-sm text-slate-400">Five Great Maps • MAX‑SIM • Umbrella • Video HUD • Console</div>
    </div>
    <div class="space-x-2">
      <button onclick="selectMap('simulation')" class="px-3 py-1 bg-[#071427] rounded text-sm">Open Simulation Map</button>
      <button onclick="runSim(1000)" class="px-3 py-1 bg-[#071427] rounded text-sm">Run 1K Sim</button>
    </div>
  </header>

  <main class="maps-grid">
    <section class="card">
      <div class="flex items-center justify-between mb-3">
        <div>
          <strong>Five Great Maps</strong>
          <div class="text-xs text-slate-400">MAPS: Physics • Compute • Simulation • Cognition • Markets</div>
        </div>
        <div class="text-xs text-slate-400">Persistence: localStorage</div>
      </div>

      <div class="map-tabs" id="mapTabs"></div>
      <div id="maps-container" style="min-height:280px"></div>
      <div class="mt-3 flex gap-2">
        <button onclick="exportMaps()" class="px-3 py-1 bg-[#071427] rounded">Export maps</button>
        <button onclick="importMaps()" class="px-3 py-1 bg-[#071427] rounded">Import maps</button>
      </div>
    </section>

    <aside class="card">
      <div class="mb-3"><strong>Umbrella Graph</strong></div>
      <div id="umbrella" style="display:grid;gap:8px">
        <!-- nodes injected -->
      </div>

      <div class="mt-4"><strong>MAX‑SIM Controls</strong></div>
      <div class="mt-2 flex gap-2">
        <button onclick="runSim(100)" class="px-2 py-1 bg-[#071427] rounded">100</button>
        <button onclick="runSim(1000)" class="px-2 py-1 bg-[#071427] rounded">1K</button>
        <button onclick="runSim(10000)" class="px-2 py-1 bg-[#071427] rounded">10K</button>
      </div>

      <div class="mt-4"><strong>Video / HUD</strong></div>
      <div class="mt-2">
        <button onclick="toggleCameraView()" class="px-3 py-1 bg-[#071427] rounded w-full">Camera On/Off</button>
        <button onclick="toggleHud()" class="mt-2 px-3 py-1 bg-[#071427] rounded w-full">HUD On/Off</button>
      </div>

      <div class="mt-4"><strong>Console</strong></div>
      <div id="cli-output" style="height:120px;overflow:auto;background:#000;border-radius:6px;padding:8px;margin-top:8px;font-family:monospace;font-size:12px"></div>
      <form onsubmit="handleCliSubmit(event)" class="mt-2 flex gap-2">
        <input id="cli-input" class="flex-1 px-2 py-1 rounded bg-[#071427] text-sm" placeholder="command..." />
        <button type="submit" class="px-3 py-1 bg-[#071427] rounded">Run</button>
      </form>
    </aside>

    <!-- large lower area for video & HUD -->
    <section class="card" style="grid-column:1 / -1; margin-top:12px">
      <div class="flex items-center justify-between mb-2">
        <strong>MAX‑SIM VIDEO HUD</strong>
        <div class="text-xs text-slate-400">Sources: Webcam • MP4 • HLS</div>
      </div>

      <div style="display:flex;gap:12px">
        <div style="flex:1">
          <div class="video-module hud" style="height:360px;">
            <video id="simVideo" autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover;border-radius:8px"></video>
            <video id="liveVideo" autoplay muted playsinline style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:8px"></video>
            <canvas id="hudCanvas" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border-radius:8px"></canvas>
          </div>

          <div class="mt-2 flex gap-2">
            <button onclick="loadView('qb')" class="px-3 py-1 bg-[#071427] rounded">QB</button>
            <button onclick="loadView('coverage')" class="px-3 py-1 bg-[#071427] rounded">Coverage</button>
            <button onclick="loadView('trench')" class="px-3 py-1 bg-[#071427] rounded">Trench</button>
            <button onclick="focusVideo()" class="px-3 py-1 bg-[#071427] rounded">Focus</button>
          </div>
        </div>

        <div style="width:320px">
          <div class="card" style="margin-bottom:12px">
            <strong>Map Explorer</strong>
            <div id="maps-list" style="margin-top:8px"></div>
          </div>

          <div class="card">
            <strong>Event Bus</strong>
            <div id="event-log" style="height:110px;overflow:auto;margin-top:8px;background:#000;padding:8px;border-radius:6px;font-family:monospace;font-size:12px"></div>
            <div class="mt-2"><button onclick="connectWebSocket('wss://example.com/stream')" class="px-3 py-1 bg-[#071427] rounded">Connect</button></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/maps.js"></script>
  <script src="/js/umbrella.js"></script>
  <script src="/js/maxsim.js"></script>
  <script src="/js/video.js"></script>
  <script>
    // Boot
    Maps.init();
    Umbrella.init();
    MAXSIM.init();
    Video.init();

    function handleCliSubmit(e){ e.preventDefault(); const input = document.getElementById('cli-input'); const cmd = input.value.trim(); if (cmd){ runCommandFromCli(cmd); input.value = ''; }}
    function runCommandFromCli(cmd){ document.getElementById('cli-output').innerText += '> '+cmd+'\n'; MAXSIM.handleCommand(cmd); }
  </script>
</body>
</html>
